# Mantém o projeto Supabase acordado.
# No plano gratuito o Supabase pausa projetos sem uso por ~7 dias.
# Esta rotina faz uma leitura simples no banco 2x por semana (não grava nada).
# Se falhar, o GitHub manda e-mail avisando — sinal de que o projeto pausou.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 * * 1,4'   # segundas e quintas, 09:17 (horário de Brasília)
  workflow_dispatch: {}       # permite rodar na mão pela aba Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler o banco (somente leitura)
        run: |
          # Endereço e chave pública (anon) são os mesmos já usados pelo app
          URL=$(grep -o "SUPABASE_URL = '[^']*'" index.html | cut -d"'" -f2)
          KEY=$(grep -o "SUPABASE_ANON = '[^']*'" index.html | cut -d"'" -f2)
          for tentativa in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "$URL/rest/v1/freddy_estado?id=eq.1&select=id" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "Tentativa $tentativa: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Supabase acordado ✅"; exit 0; fi
            sleep 20
          done
          echo "::error::Supabase não respondeu (HTTP $CODE). O projeto pode estar pausado: entre em supabase.com e clique em Resume project."
          exit 1
